name: Build liu731 Xiaozhi iOS

on:
  workflow_dispatch:
  push:
    branches:
      - liu731-test

jobs:
  build-ios:
    runs-on: macos-latest

    steps:

      - name: Clone liu731/xiaozhi
        run: |
          git clone --depth 1 https://github.com/liu731/xiaozhi.git source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Patch microphone permission
        working-directory: source
        run: |
          python3 -c '
          from pathlib import Path
          p=Path("ios/Runner/Info.plist")
          s=p.read_text()
          key="<key>NSMicrophoneUsageDescription</key>"
          if key not in s:
              s=s.replace(
                  "<dict>",
                  "<dict>\n"
                  "\t<key>NSMicrophoneUsageDescription</key>\n"
                  "\t<string>This app uses the microphone for Xiaozhi voice conversations.</string>",
                  1
              )
          p.write_text(s)
          '

      - name: Patch iOS startup
        working-directory: source
        run: |
          python3 -c '
          from pathlib import Path
          p=Path("ios/Runner/Info.plist")
          s=p.read_text()
          s=s.replace(
              "\t<key>UIMainStoryboardFile</key>\n"
              "\t<string>Main</string>\n",
              ""
          )
          p.write_text(s)
          '

          cat > ios/Runner/AppDelegate.swift <<'EOF'
import Flutter
import UIKit

@main
@objc class AppDelegate: FlutterAppDelegate {
  override func application(
    _ application: UIApplication,
    didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
  ) -> Bool {

    let flutterViewController = FlutterViewController()

    let appWindow = UIWindow(frame: UIScreen.main.bounds)
    appWindow.rootViewController = flutterViewController
    appWindow.makeKeyAndVisible()

    self.window = appWindow

    GeneratedPluginRegistrant.register(with: self)

    return super.application(
      application,
      didFinishLaunchingWithOptions: launchOptions
    )
  }
}
EOF

      - name: Patch microphone capture
        working-directory: source
        run: |
          python3 -c '
          from pathlib import Path

          p=Path("lib/bloc/chat/chat_bloc.dart")
          s=p.read_text()

          old="            echoCancel: true,"
          new="            echoCancel: false,"

          if old not in s:
              raise SystemExit("ERROR: echoCancel line not found")

          s=s.replace(old,new,1)

          old="""        _audioRecorderStream = (await _audioRecorder!.startStream(
"""
          new="""        print("MIC: permission OK");
        print("MIC: starting stream sampleRate=$_audioSampleRate channels=$_audioChannels frameDuration=$_audioFrameDuration");

        _audioRecorderStream = (await _audioRecorder!.startStream(
"""

          if old not in s:
              raise SystemExit("ERROR: startStream line not found")

          s=s.replace(old,new,1)

          old="""        ));

        if (null != _audioRecorderSubscription)"""
          new="""        ));

        print("MIC: startStream OK");

        if (null != _audioRecorderSubscription)"""

          if old not in s:
              raise SystemExit("ERROR: startStream end not found")

          s=s.replace(old,new,1)

          old="""        _audioRecorderSubscription = _audioRecorderStream!.listen((data) async {
          if (_websocketChannel != null &&"""
          new="""        _audioRecorderSubscription = _audioRecorderStream!.listen((data) async {
          print("MIC PCM: ${data.length} bytes");

          if (_websocketChannel != null &&"""

          if old not in s:
              raise SystemExit("ERROR: PCM listener not found")

          s=s.replace(old,new,1)

          old="""            if (null != opusData) {
              _websocketChannel!.sink.add(opusData);
            }"""
          new="""            print("MIC OPUS: ${opusData?.length ?? 0} bytes");

            if (null != opusData) {
              _websocketChannel!.sink.add(opusData);
              print("MIC WS: sent");
            }"""

          if old not in s:
              raise SystemExit("ERROR: Opus send not found")

          s=s.replace(old,new,1)

          old="""        });
      }

      if (event is ChatOnMessageEvent)"""
          new="""        }, onError: (e, s) {
          print("MIC STREAM ERROR: $e");
          print(s);
        });
      }

      if (event is ChatOnMessageEvent)"""

          if old not in s:
              raise SystemExit("ERROR: microphone error handler location not found")

          s=s.replace(old,new,1)

          p.write_text(s)

          print("MIC PATCH OK")
          '

          echo "===== echoCancel ====="
          grep -n "echoCancel" lib/bloc/chat/chat_bloc.dart

          echo "===== MIC markers ====="
          grep -n "MIC:" lib/bloc/chat/chat_bloc.dart

      - name: Verify patches
        working-directory: source
        run: |
          echo "===== UIMainStoryboardFile ====="

          if grep -q "UIMainStoryboardFile" ios/Runner/Info.plist; then
            echo "ERROR: UIMainStoryboardFile still exists"
            exit 1
          fi

          echo "OK: storyboard startup removed"

          echo
          echo "===== Microphone permission ====="

          grep -A1 "NSMicrophoneUsageDescription" \
            ios/Runner/Info.plist

          echo
          echo "===== echoCancel ====="

          grep "echoCancel" \
            lib/bloc/chat/chat_bloc.dart

          echo
          echo "===== MIC debug ====="

          grep -n "MIC:" \
            lib/bloc/chat/chat_bloc.dart

      - name: Flutter pub get
        working-directory: source
        run: |
          flutter pub get

      - name: Build iOS
        working-directory: source
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Create IPA
        working-directory: source
        run: |
          mkdir -p ../ipa/Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            ../ipa/Payload/Xiaozhi.app

          cd ../ipa

          zip -r \
            ../xiaozhi-liu731.ipa \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-liu731-ios
          path: xiaozhi-liu731.ipa
          retention-days: 14