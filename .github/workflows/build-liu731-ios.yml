name: Build liu731 Xiaozhi iOS

on:
  workflow_dispatch:
  push:
    branches:
      - liu731-test

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Clone liu731/xiaozhi
        run: |
          git clone --depth 1 https://github.com/liu731/xiaozhi.git source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Patch microphone permission
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/Runner/Info.plist")
          s = p.read_text()

          key = "<key>NSMicrophoneUsageDescription</key>"

          if key not in s:
              s = s.replace(
                  "<dict>",
                  "<dict>\n"
                  "\t<key>NSMicrophoneUsageDescription</key>\n"
                  "\t<string>This app uses the microphone for Xiaozhi voice conversations.</string>",
                  1
              )

          p.write_text(s)
          PY

      - name: Patch iOS startup for iOS 15 test
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Bypass UIKit loading Main.storyboard.
          # Current crash occurs in:
          # -[UIApplication _loadMainStoryboardFileNamed:bundle:]
          #
          # Create FlutterViewController directly instead.

          plist = Path("ios/Runner/Info.plist")
          s = plist.read_text()

          s = s.replace(
              "\t<key>UIMainStoryboardFile</key>\n"
              "\t<string>Main</string>\n",
              ""
          )

          plist.write_text(s)

          app_delegate = Path("ios/Runner/AppDelegate.swift")

          app_delegate.write_text("""import Flutter
import UIKit

@main
@objc class AppDelegate: FlutterAppDelegate {
  override func application(
    _ application: UIApplication,
    didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
  ) -> Bool {

    let flutterViewController = FlutterViewController()

    let appWindow = UIWindow(frame: UIScreen.main.bounds)
    appWindow.rootViewController = flutterViewController
    appWindow.makeKeyAndVisible()

    self.window = appWindow

    GeneratedPluginRegistrant.register(with: self)

    return super.application(
      application,
      didFinishLaunchingWithOptions: launchOptions
    )
  }
}
""")
          PY

      - name: Verify iOS startup patch
        working-directory: source
        run: |
          echo "========== Info.plist =========="
          echo "--- Main storyboard ---"
          grep -A1 "UIMainStoryboardFile" ios/Runner/Info.plist || true

          echo "--- Launch storyboard ---"
          grep -A1 "UILaunchStoryboardName" ios/Runner/Info.plist || true

          echo "--- Microphone ---"
          grep -A1 "NSMicrophoneUsageDescription" ios/Runner/Info.plist || true

          echo
          echo "========== AppDelegate.swift =========="
          cat ios/Runner/AppDelegate.swift

          echo
          echo "========== Podfile microphone =========="
          grep -A3 "PERMISSION_MICROPHONE" ios/Podfile || true

      - name: Flutter pub get
        working-directory: source
        run: |
          flutter pub get

      - name: Build iOS
        working-directory: source
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Create IPA
        working-directory: source
        run: |
          mkdir -p ../ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ../ipa/Payload/Xiaozhi.app
          cd ../ipa
          zip -r ../xiaozhi-liu731.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-liu731-ios
          path: xiaozhi-liu731.ipa
          retention-days: 14
