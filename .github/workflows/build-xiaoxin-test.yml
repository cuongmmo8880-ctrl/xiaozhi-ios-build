name: Build XiaoXin Test IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build XiaoXin iOS
    runs-on: macos-latest

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Clone XiaoXin
        run: |
          git clone https://github.com/fengin/xiaoxin-app.git source
          cd source
          git checkout main
          git log -1 --oneline

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Patch iOS microphone permission
        working-directory: source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          podfile = Path("ios/Podfile")

          if not podfile.exists():
              raise SystemExit("ERROR: ios/Podfile not found")

          text = podfile.read_text()

          print("===== ORIGINAL Podfile =====")
          print(text)
          print("===== END ORIGINAL Podfile =====")

          marker = "PERMISSION_MICROPHONE=1"

          if marker in text:
              print("PERMISSION_MICROPHONE=1 already exists")
          else:
              target = "flutter_additional_ios_build_settings(target)"

              if target not in text:
                  raise SystemExit(
                      "ERROR: flutter_additional_ios_build_settings(target) "
                      "not found in ios/Podfile"
                  )

              replacement = """flutter_additional_ios_build_settings(target)

          target.build_configurations.each do |config|
            config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= [
              '$(inherited)',
              'PERMISSION_MICROPHONE=1',
            ]
          end"""

              text = text.replace(target, replacement, 1)

              podfile.write_text(text)

          print("===== PATCHED Podfile =====")
          print(text)
          print("===== END PATCHED Podfile =====")
          PY

      - name: Patch XiaoXin voice transport
        working-directory: source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          session = Path("lib/core/session_manager.dart")
          processor = Path("lib/modules/audio/audio_processor.dart")

          s = session.read_text()
          old = """  void _onAudioData(Uint8List data) {
    if (_currentState != DeviceState.speaking) {
      return;
    }
    AudioService.instance.playOpusAudio(data);
  }"""
          new = """  void _onAudioData(Uint8List data) {
    if (_currentSessionId == null) {
      return;
    }
    AudioService.instance.playOpusAudio(data);
  }"""
          if old not in s:
              raise SystemExit("session_manager.dart: _onAudioData block not found")
          s = s.replace(old, new, 1)

          old = """      // 【修正】不在会话开始时发送 listen start
      // listen start 由 audio_processor 在 VAD 检测到语音开始时发送
      // 这样每次对话（而不是每次会话）都有独立的 listen start/stop

      // 启用 VAD（录音已在 initialize 时启动）
      AudioService.instance.enableVad(true);"""
          new = """      // Start VAD/transport immediately. AudioProcessor opens
      // the server listen state without waiting for local speech detection.
      await AudioService.instance.enableVad(true);"""
          if old not in s:
              raise SystemExit("session_manager.dart: _startListening block not found")
          s = s.replace(old, new, 1)
          session.write_text(s)

          p = processor.read_text()

          old = """    if (enable && !wasEnabled) {
      _wasSpeaking = false;  // 从禁用变为启用时重置状态
      await RecordService.instance.resumeRecording();
      AppLogger.d('VAD enabled (was disabled), _wasSpeaking reset to false');
    } else if (enable && wasEnabled) {
      // VAD 已经在工作，不重置状态
      AppLogger.d('VAD already enabled, keeping _wasSpeaking=$_wasSpeaking');
    } else {
      AppLogger.d('VAD disabled');
    }"""
          new = """    if (enable && !wasEnabled) {
      _wasSpeaking = false;
      await RecordService.instance.resumeRecording();

      if (ProtocolService.instance.isConnected) {
        ProtocolService.instance.sendStartListening(mode: 'realtime');
      }

      AppLogger.d('VAD enabled, server listen started');
    } else if (enable && wasEnabled) {
      AppLogger.d('VAD already enabled, keeping transport alive');
    } else if (!enable && wasEnabled) {
      if (ProtocolService.instance.isConnected) {
        ProtocolService.instance.sendStopListening();
      }
      AppLogger.d('VAD disabled, server listen stopped');
    } else {
      AppLogger.d('VAD disabled');
    }"""
          if old not in p:
              raise SystemExit("audio_processor.dart: enableVad block not found")
          p = p.replace(old, new, 1)

          start = p.index("    // ========== 4. VAD 状态检测与发送逻辑 ==========")
          end = p.index("  int _totalFramesSent = 0;", start)
          replacement = """    // ========== 4) Transport-level microphone streaming ==========
    // Keep KWS/VAD processing for wake-word/UI behavior, but do not
    // require VoiceEngine.isSpeaking before sending microphone audio.
    if (_vadEnabled) {
      if (_pcmBuffer.length + dataFor16k.length > _maxPcmBufferSize) {
        AppLogger.w('PCM buffer overflow (' + _pcmBuffer.length.toString() + ' bytes), clearing');
        _pcmBuffer.clear();
      }

      _pcmBuffer.addAll(dataFor16k);

      int framesSent = 0;
      while (_pcmBuffer.length >= _opusBytesPerFrame) {
        _encodeAndSend();
        framesSent++;
      }

      if (framesSent > 0) {
        _totalFramesSent += framesSent;
        if (_totalFramesSent % 10 == 0) {
          AppLogger.d('已发送 ' + _totalFramesSent.toString() + ' 帧音频');
        }
      }
    }

"""
          p = p[:start] + replacement + p[end:]
          processor.write_text(p)

          print("VOICE TRANSPORT PATCH APPLIED")
          print("MCP code untouched")
          PY

      - name: Verify microphone configuration
        working-directory: source
        run: |
          echo "===== CHECK Podfile ====="
          grep -n -A12 -B3 "PERMISSION_MICROPHONE" ios/Podfile || true

          echo ""
          echo "===== CHECK Info.plist ====="
          grep -n -A2 -B2 "NSMicrophoneUsageDescription" ios/Runner/Info.plist || true

          echo ""
          echo "===== CHECK iOS files ====="
          ls -la ios
          ls -la ios/Runner

      - name: Get dependencies
        working-directory: source
        run: |
          flutter pub get

      - name: Build iOS
        working-directory: source
        run: |
          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Verify built app
        working-directory: source
        run: |
          echo "===== BUILD OUTPUT ====="
          ls -lah build/ios/iphoneos/

          echo ""
          echo "===== APP INFO ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            build/ios/iphoneos/Runner.app/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            build/ios/iphoneos/Runner.app/Info.plist || true

          echo ""
          echo "===== MICROPHONE USAGE DESCRIPTION ====="

          /usr/libexec/PlistBuddy \
            -c "Print :NSMicrophoneUsageDescription" \
            build/ios/iphoneos/Runner.app/Info.plist

      - name: Create IPA
        working-directory: source
        shell: bash
        run: |
          set -e

          rm -rf Payload
          rm -f xiaoxin-app-test.ipa

          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app Payload/

          echo "===== PAYLOAD STRUCTURE ====="
          find Payload -maxdepth 2 -type d -print

          echo ""
          echo "===== CREATE IPA ====="

          zip -r xiaoxin-app-test.ipa Payload

          echo ""
          echo "===== IPA FILE ====="
          ls -lh xiaoxin-app-test.ipa

          echo ""
          echo "===== VERIFY IPA STRUCTURE ====="
          unzip -l xiaoxin-app-test.ipa | head -30

          echo ""
          echo "===== VERIFY PAYLOAD/Runner.app ====="

          unzip -l xiaoxin-app-test.ipa | grep "Payload/Runner.app/Info.plist"

          if [ $? -ne 0 ]; then
            echo "ERROR: Payload/Runner.app/Info.plist not found!"
            exit 1
          fi

          echo "IPA structure OK."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxin-app-test-ipa
          path: source/xiaoxin-app-test.ipa
          retention-days: 7
