name: Build XiaoXin Test IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build XiaoXin iOS
    runs-on: macos-latest

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Clone XiaoXin
        run: |
          git clone https://github.com/fengin/xiaoxin-app.git source
          cd source
          git checkout main
          git log -1 --oneline

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Patch iOS microphone permission
        working-directory: source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          podfile = Path("ios/Podfile")

          if not podfile.exists():
              raise SystemExit("ERROR: ios/Podfile not found")

          text = podfile.read_text()

          marker = "PERMISSION_MICROPHONE=1"

          if marker not in text:
              target = "flutter_additional_ios_build_settings(target)"

              if target not in text:
                  raise SystemExit(
                      "ERROR: flutter_additional_ios_build_settings(target) "
                      "not found in ios/Podfile"
                  )

              replacement = """flutter_additional_ios_build_settings(target)

          target.build_configurations.each do |config|
            config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= [
              '$(inherited)',
              'PERMISSION_MICROPHONE=1',
            ]
          end"""

              text = text.replace(target, replacement, 1)
              podfile.write_text(text)

          print("PERMISSION_MICROPHONE=1 configured")
          PY

      - name: Patch XiaoXin voice transport
        run: |
          python3 patch_xiaoxin_voice.py

      - name: Verify microphone configuration
        working-directory: source
        run: |
          echo "===== CHECK Podfile ====="
          grep -n -A12 -B3 "PERMISSION_MICROPHONE" ios/Podfile || true

          echo ""
          echo "===== CHECK Info.plist ====="
          grep -n -A2 -B2 "NSMicrophoneUsageDescription" ios/Runner/Info.plist || true

      - name: Get dependencies
        working-directory: source
        run: |
          flutter pub get

      - name: Prepare iOS project without signing
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FLUTTER ====="
          flutter --version

          echo "===== FLUTTER IOS CONFIG ====="
          flutter build ios --release --config-only

          echo "===== COCOAPODS ====="
          cd ios
          pod install --repo-update
          cd ..

          echo "===== XCODE ====="
          xcodebuild -version

      - name: Build unsigned iOS app
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ios/xcode

          xcodebuild             -workspace ios/Runner.xcworkspace             -scheme Runner             -configuration Release             -sdk iphoneos             -derivedDataPath build/ios/xcode             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             build

      - name: Verify built app
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/ios/xcode/Build/Products/Release-iphoneos/Runner.app"

          echo "===== BUILD OUTPUT ====="
          ls -lah build/ios/xcode/Build/Products/Release-iphoneos/

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found at $APP_PATH"
            exit 1
          fi

          echo ""
          echo "===== APP INFO ====="

          /usr/libexec/PlistBuddy             -c "Print :CFBundleIdentifier"             "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy             -c "Print :CFBundleDisplayName"             "$APP_PATH/Info.plist" || true

          echo ""
          echo "===== MICROPHONE USAGE DESCRIPTION ====="

          /usr/libexec/PlistBuddy             -c "Print :NSMicrophoneUsageDescription"             "$APP_PATH/Info.plist"

      - name: Create IPA
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/ios/xcode/Build/Products/Release-iphoneos/Runner.app"

          rm -rf Payload
          rm -f xiaoxin-app-test.ipa

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app

          echo "===== CREATE IPA ====="
          zip -qry xiaoxin-app-test.ipa Payload

          echo ""
          echo "===== IPA FILE ====="
          ls -lh xiaoxin-app-test.ipa

          echo ""
          echo "===== VERIFY IPA ====="
          unzip -l xiaoxin-app-test.ipa | grep "Payload/Runner.app/Info.plist"

          echo "IPA structure OK."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxin-app-test-ipa
          path: source/xiaoxin-app-test.ipa
          retention-days: 7
