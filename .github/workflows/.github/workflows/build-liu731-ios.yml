name: Build liu731 Xiaozhi iOS

on:
  workflow_dispatch:
  push:
    branches:
      - liu731-test

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Clone liu731/xiaozhi
        run: |
          git clone --depth 1 https://github.com/liu731/xiaozhi.git source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Patch microphone permission
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/Runner/Info.plist")
          s = p.read_text()

          key = "<key>NSMicrophoneUsageDescription</key>"

          if key not in s:
              s = s.replace(
                  "<dict>",
                  "<dict>\n"
                  "\t<key>NSMicrophoneUsageDescription</key>\n"
                  "\t<string>This app uses the microphone for Xiaozhi voice conversations.</string>",
                  1
              )

          p.write_text(s)
          PY

      - name: Verify microphone permission
        working-directory: source
        run: |
          grep -A1 NSMicrophoneUsageDescription ios/Runner/Info.plist
          grep -A3 PERMISSION_MICROPHONE ios/Podfile || true

      - name: Flutter pub get
        working-directory: source
        run: |
          flutter pub get

      - name: Build iOS
        working-directory: source
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Create IPA
        working-directory: source
        run: |
          mkdir -p ../ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ../ipa/Payload/Xiaozhi.app
          cd ../ipa
          zip -r ../xiaozhi-liu731.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-liu731-ios
          path: xiaozhi-liu731.ipa
          retention-days: 14
